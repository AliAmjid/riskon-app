# Vite UI only. The NestJS API (Cursor agents, Socket.IO, Postgres, disk
# storage) is a long-running process and cannot run as a Netlify Function.
[build]
  command = "npm run build -w @riskon/shared && npm run build -w web"
  publish = "apps/web/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ./apps/web ./packages/shared ./package-lock.json ./package.json ./netlify.toml"

[build.environment]
  NODE_VERSION = "24"

# Required at build time (set in the Netlify UI / `netlify env:set`):
#   VITE_API_URL  public origin of the API, e.g. https://api.example.com
# Do not put secrets in VITE_* vars — they are inlined into the browser bundle.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
