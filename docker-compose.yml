services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskon
      POSTGRES_PASSWORD: riskon
      POSTGRES_DB: riskon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskon -d riskon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://riskon:riskon@postgres:5432/riskon
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
      RISKON_AGENT_PATH: /workspace/riskon-agent
    volumes:
      - ${RISKON_AGENT_HOST_PATH:-/Users/aliamjid/.cursor/riskon-agent}:/workspace/riskon-agent:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
